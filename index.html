<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Hub – Debug</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 p-8">
  <div id="app" class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">🏠 Property Hub – Debug Mode</h1>
    <div id="status" class="bg-yellow-100 p-4 rounded mb-4">Loading properties...</div>
    <div id="listings" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ubkgovgoifgpazkapaxi.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVia2dvdmdvaWZncGF6a2FwYXhpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MTExOTEsImV4cCI6MjEwMzI4NzE5MX0.upcDE6ucde7lsrPfPssWhoK54PNRDW701tkt2H4hP0A';

    // Load Supabase client from CDN
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js';
    script.onload = async () => {
      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      const status = document.getElementById('status');

      try {
        // 1. Test connection – fetch properties
        const { data: properties, error } = await supabase
          .from('properties')
          .select('*')
          .limit(10);

        if (error) throw error;

        status.textContent = `✅ Loaded ${properties.length} properties.`;
        status.className = 'bg-green-100 p-4 rounded mb-4';

        // 2. Display property titles
        const container = document.getElementById('listings');
        if (properties.length === 0) {
          container.innerHTML = '<p class="text-slate-500">No properties found in your table.</p>';
        } else {
          container.innerHTML = properties.map(p => `
            <div class="bg-white p-4 rounded shadow">
              <h2 class="font-bold">${p.title || 'Untitled'}</h2>
              <p class="text-sm text-slate-600">Price: ${p.price_amount || 'N/A'}</p>
              <p class="text-sm text-slate-600">Type: ${p.property_type || 'N/A'}</p>
              <p class="text-sm text-slate-500">Owner ID: ${p.owner_id || 'none'}</p>
            </div>
          `).join('');
        }

        // 3. Log the full data to console
        console.log('📦 Properties fetched:', properties);

        // 4. Check if owner_id column exists
        if (properties.length > 0 && !properties[0].hasOwnProperty('owner_id')) {
          console.warn('⚠️ "owner_id" column not found in properties table. Check your column names.');
          status.innerHTML += ' <span class="text-red-500">(No owner_id column – check schema)</span>';
        }

      } catch (err) {
        status.textContent = '❌ Error: ' + err.message;
        status.className = 'bg-red-100 p-4 rounded mb-4';
        console.error('Supabase error:', err);
      }
    };
    script.onerror = () => {
      document.getElementById('status').textContent = '❌ Failed to load Supabase client. Check network.';
    };
    document.head.appendChild(script);
  </script>
</body>
</html>
